# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# Release version. The single source of truth.
# ---------------------------------------------------------------------------------------------
#
# These are read by app/build.gradle.kts and validated by the `validateVersion` task, which every
# release build depends on. They are deliberately plain source values:
#
#   * versionCode is NOT derived from the CI run number, commit count or a timestamp. Those change
#     when you rebuild the same commit, and Play permanently rejects a versionCode it has already
#     seen. A rebuild of one tag must produce the same versionCode.
#   * The release workflow never edits or commits these. Bumping a version is a reviewable source
#     change in a pull request, not something a pipeline does behind you.
#   * The release tag must be exactly v${APP_VERSION_NAME}.
#
# Every Play Console upload must use a strictly larger APP_VERSION_CODE than any previously
# uploaded build. Play rejects equal or lower values and the decision cannot be undone.
APP_VERSION_CODE=1
APP_VERSION_NAME=0.1.0-beta.1
