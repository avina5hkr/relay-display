<?xml version="1.0" encoding="UTF-8"?>
<!--
  Relay Display logo - editable master.

  Original artwork for this project. No downloaded, purchased, traced or third-party asset is
  used, and the mark is built entirely from three geometric primitives.

  Concept: the phone you hold (left, smaller) relays content to the companion display (right,
  taller). The wedge is the content in flight.

  This file and app/src/main/res/drawable/ic_launcher_*.xml are both generated from the geometry
  in branding/generate_launcher_icons.py. Edit the script, re-run it, and regenerate this file;
  hand-editing one copy makes them disagree.

  108x108 viewport matches Android's adaptive-icon canvas so coordinates transfer unchanged.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <title>Relay Display</title>
  <!-- Legacy/marketing plate. The adaptive background is a full-bleed square instead. -->
  <path d="M30.0,8.0 L78.0,8.0 A22.0,22.0 0 0 1 100.0,30.0 L100.0,78.0 A22.0,22.0 0 0 1 78.0,100.0 L30.0,100.0 A22.0,22.0 0 0 1 8.0,78.0 L8.0,30.0 A22.0,22.0 0 0 1 30.0,8.0 Z" fill="#0A2A4F"/>
  <!-- Controller: the phone you hold -->
  <path d="M32.5,44.0 L38.5,44.0 A3.5,3.5 0 0 1 42.0,47.5 L42.0,60.5 A3.5,3.5 0 0 1 38.5,64.0 L32.5,64.0 A3.5,3.5 0 0 1 29.0,60.5 L29.0,47.5 A3.5,3.5 0 0 1 32.5,44.0 Z" fill="#FFFFFF"/>
  <!-- Companion display: the spare with the good screen -->
  <path d="M67.0,36.0 L73.0,36.0 A5.0,5.0 0 0 1 78.0,41.0 L78.0,67.0 A5.0,5.0 0 0 1 73.0,72.0 L67.0,72.0 A5.0,5.0 0 0 1 62.0,67.0 L62.0,41.0 A5.0,5.0 0 0 1 67.0,36.0 Z" fill="#FFFFFF"/>
  <!-- The relay: content in flight -->
  <path d="M45.0,45.0 L59.5,54.0 L45.0,63.0 Z" fill="#6FF6FE"/>
</svg>
