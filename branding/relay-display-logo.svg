<!--
  Relay Display logo, editable master.

  Original artwork for this project, built entirely from three geometric primitives. No
  downloaded, purchased, traced or third party asset is involved.

  Concept: the phone you hold (left, smaller) relays content to the companion display
  (right, taller). The wedge is the content in flight.

  Generated by branding/generate_launcher_icons.py, which holds the geometry. Do not hand
  edit: change the script and re-run it, or this file and the others will disagree.

  108x108 viewport matches Android's adaptive-icon canvas so coordinates transfer
  unchanged.
-->
